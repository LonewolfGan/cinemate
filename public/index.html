<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Favicon + icons -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/logo192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/logo192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="%PUBLIC_URL%/logo512.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Viewport & theme -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080808" />
    <meta name="color-scheme" content="dark" />
    <meta name="msapplication-TileColor" content="#080808" />

    <!-- Primary SEO defaults (overridden per-page by react-helmet-async) -->
    <title>Cinemate · Premium Cinema Discovery</title>
    <meta name="description" content="Discover, explore, and fall in love with cinema. Premium movie discovery powered by TMDB — browse popular films, top rated classics, and upcoming releases." />
    <meta name="keywords" content="movies, cinema, film, movie discovery, TMDB, top rated, popular films, upcoming movies, watch films" />
    <meta name="author" content="Cinemate" />
    <meta name="robots" content="index,follow" />

    <!-- Open Graph defaults -->
    <meta property="og:site_name" content="Cinemate" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cinemate · Premium Cinema Discovery" />
    <meta property="og:description" content="Discover, explore, and fall in love with cinema. Premium movie discovery powered by TMDB." />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Cinemate — Premium Cinema Discovery" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card defaults -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@cinemate" />
    <meta name="twitter:creator" content="@cinemate" />
    <meta name="twitter:title" content="Cinemate · Premium Cinema Discovery" />
    <meta name="twitter:description" content="Discover, explore, and fall in love with cinema. Premium movie discovery powered by TMDB." />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="Cinemate — Premium Cinema Discovery" />

    <!-- JSON-LD: WebSite + SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Cinemate",
      "description": "Premium cinema discovery platform powered by TMDB. Browse popular, top rated, and upcoming movies.",
      "url": "https://cinematelone.netlify.app",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://cinematelone.netlify.app/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Cinemate",
      "url": "https://cinematelone.netlify.app",
      "logo": "https://cinematelone.netlify.app/logo512.png",
      "sameAs": [
        "https://twitter.com/cinemate",
        "https://instagram.com/cinemate",
        "https://letterboxd.com/cinemate"
      ]
    }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
